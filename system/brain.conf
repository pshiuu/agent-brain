# The base's defaults for how a brain runs. One KEY=value per line. Set your own in
# system/brain.local.conf (same format, ignored by git, read first), never here: this file
# is the base's and an update replaces it. The environment beats both, so
# `BRAIN_PHASE_TIMEOUT=600 brain run` stays a one-off that changes nothing.
# Read with awk, never sourced — a typo is an ignored line, not a command.
#
# These four only matter when nobody is watching a `brain auto`:
#
#   BRAIN_PHASE_TIMEOUT  seconds one phase may run without writing its handoff file.
#                        0 = off (a hung agent then blocks until you notice).
#   BRAIN_MAX_RUNS       agent runs in one `brain auto`, as a backstop for a fix loop
#                        that is not converging. Human gates do not count. 0 = off.
#   BRAIN_MAX_FIX_LOOPS  FAIL rounds one review phase may take before it stops and asks.
#   BRAIN_NOTIFY         any command; the message is appended as its last argument.
#                        Fires on completion, at a gate, on a ceiling, on any error.
#                        e.g. terminal-notifier -title brain -message

BRAIN_PHASE_TIMEOUT=0

# `brain watch` opens one Terminal window per run the cockpit asks for. This caps how
# many projects run at once; the rest wait in their .run-request and start as windows
# close. 0 = no cap.
BRAIN_MAX_PARALLEL=3

# Where `brain app install <name>` finds an app: a git repo (owner/repo or a URL) with one
# folder per app. `--from` overrides it for one install.
APPS_SOURCE=pshiuu/agent-brain-apps

# For an app's developer only: your checkout of the apps repo. `brain app promote <name>`
# merges this brain's own changes to an installed app into it, for you to commit and push.
# Set it in brain.local.conf; leave it unset on a brain that only uses apps.
# APPS_DEV=~/agent-brain-apps
