# What every brain sandbox gets: MCP servers and network rules.
# Applied by `brain sync-sandbox` (and `brain init`). Nothing here happens until
# you sync — like skills.list, this file is intent, not the state of sbx.
#
#   mcp <name> <sbx mcp add flags...>   register a server and attach it to new sandboxes
#   allow <host>[,<host>...]            hosts sandboxes may reach
#   deny  <host>[,<host>...]            hosts they may not (deny beats allow)
#
# Hosts take *.example.com wildcards and an optional :port. Rules are global
# (all sandboxes) and idempotent; remove one with `sbx policy rm network
# --resource <host>` and take the line out here too, or the next sync re-adds it.
#
# A name sbx already knows is left alone, so a sync never re-runs an OAuth
# consent flow. To change a server: `sbx mcp rm <name>`, then sync again.
# A server whose flags need quoting (--header 'Authorization: Bearer ${k}')
# does not survive this file — register it by hand with `sbx mcp add`.
#
# Existing sandboxes keep the MCP set they were created with: --static-mcp is
# chosen once, at create time. Add one to a running sandbox with
# `sbx mcp load <name> --sandbox <sandbox>`, or delete the sandbox and let
# `brain run` build it again.

# mcp github --url https://api.githubcopilot.com/mcp/
# mcp notion --url https://mcp.notion.com/mcp
#
# An installed app brings its own servers and hosts in its app.conf (mcp, secret, allow);
# brain sync-sandbox registers those too. A server with a key is connected from the
# Studio's Admin page for that app, never from here.
#
# Not the playwright MCP: a --command server runs on your Mac, so its browser
# cannot reach the dev server inside the sandbox. The sandbox image already has
# Playwright and Chromium — the visual-qa skill and `brain-shoot` use them there.

# Egress is allow-all by default (sbx's own local-policy), so deny is the useful
# direction until you narrow that yourself.
# deny pastebin.com,*.ngrok.io
