# The agents a phase can run on. A role names one in roles.conf; this brain builds and runs
# only the ones in BRAIN_ENGINES (system/brain.local.conf, set by install.sh). Add one later
# with `brain engine add <name>`, which builds its sandbox image.
#
# engine     the name roles.conf uses
# template   the Docker Sandboxes image it is built on: docker/sandbox-templates:<template>
# role       where the role's instructions go in the sandbox's home, the file that engine
#            reads before anything else; - when it takes them as a flag (Claude)
# efforts    the reasoning efforts it accepts, - for an engine without the setting
# label      what the installer and the cockpit call it
#
# engine   template            role                         efforts                      label
claude     claude-code-docker  -                            low,medium,high,xhigh,max    Claude Code (Anthropic)
codex      codex-docker        .codex/AGENTS.md             none,low,medium,high,xhigh   Codex (OpenAI)
gemini     gemini-docker       .gemini/GEMINI.md            -                            Gemini CLI (Google)
opencode   opencode-docker     .config/opencode/AGENTS.md   -                            OpenCode (any model provider)
