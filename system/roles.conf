# role              engine   model    [effort]
# Which agent + model handles each role. Change one line to switch.
# model:  a model name/alias for that engine, or "default" to use the engine's default.
# effort: optional reasoning effort. Leave it out for the engine's own default.
#         claude: low medium high xhigh max   codex: none low medium high xhigh max
#         Per model, not per engine — Codex's own catalog is the authority, and the
#         cockpit reads it. brain only rejects values neither engine has.
#
# Only the authors, the brain's own editor and its analyst are here. Every other role
# is one you write, with `brain role new` or the cockpit, for the playbooks you run.
playbook-author       claude   opus         medium
role-author           claude   opus         medium
system-editor         claude   opus         medium
playbook-analyst      claude   opus         medium

retro                 claude   opus         medium

